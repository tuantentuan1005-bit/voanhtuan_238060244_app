# Configured for 7GB RAM host with multi-core i5-1240P
# Uses SerialGC and 1GB heap with 2 compiler threads to prevent Native OOM
org.gradle.jvmargs=-Xmx1024m -XX:+UseSerialGC -XX:CICompilerCount=2 -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=false
android.newDsl=false
android.builtInKotlin=false
